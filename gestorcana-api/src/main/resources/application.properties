# Nome da aplicação
spring.application.name=gestorcana-api

# Conexão com o Banco de Dados PostgreSQL (Supabase Connection Pooler)
# Credenciais carregadas via variáveis de ambiente ou secrets.properties (ver secrets.properties.example)
spring.config.import=optional:file:./secrets.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true