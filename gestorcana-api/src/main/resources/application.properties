# Nome da aplicação
spring.application.name=gestorcana-api

# Conexão com o Banco de Dados PostgreSQL (Supabase Connection Pooler)
# Credenciais carregadas via variáveis de ambiente ou secrets.properties (ver secrets.properties.example)
spring.config.import=optional:file:./secrets.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway (migrações) - usa o Session pooler (porta 5432), não o Transaction pooler
spring.flyway.url=${DB_FLYWAY_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=estrutura inicial v3