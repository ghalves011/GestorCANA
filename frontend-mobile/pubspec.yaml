name: gestorcana_mobile
description: "GestorCANA - gestão de time de futebol amador (cliente mobile)."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP client
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Local persistence (base URL override, last-used season, etc.)
  shared_preferences: ^2.3.3

  # Dates / currency (pt-BR)
  intl: ^0.19.0

  # WhatsApp deep link / generic URL launching
  url_launcher: ^6.3.1

  # Native share sheet (receipts, scoreboard screenshot)
  share_plus: ^10.1.2

  # Temp dir for screenshot files before sharing
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_cana.png
